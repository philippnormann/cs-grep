# Human-computer interaction venues bundled with cs-grep.
# Order matters: a paper listed in several venues is stored under the last one,
# so list workshops and co-located venues after their host.

venues:
  - id: CHI
    name: ACM Conference on Human Factors in Computing Systems
    dblp_stream: conf/chi
    aliases: [chi]
    rank: A*
    tags: [hci]

  - id: HCII
    name: International Conference on Human-Computer Interaction
    dblp_stream: conf/hci
    aliases: [hcii, hci-international]
    tags: [hci]

  - id: FAccT
    name: ACM Conference on Fairness, Accountability, and Transparency
    dblp_stream: conf/fat
    aliases: [facct, fat]
    tags: [hci, ml]
