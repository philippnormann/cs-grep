# Cryptography venues bundled with cs-grep.
# Order matters: a paper listed in several venues is stored under the last one,
# so list workshops and co-located venues after their host.

venues:
  - id: CRYPTO
    name: International Cryptology Conference
    dblp_stream: conf/crypto
    aliases: [crypto]
    rank: A*
    tags: [crypto]

  - id: EUROCRYPT
    name: International Conference on the Theory and Applications of Cryptographic Techniques
    dblp_stream: conf/eurocrypt
    aliases: [eurocrypt]
    rank: A*
    tags: [crypto]

  - id: ASIACRYPT
    name: International Conference on the Theory and Application of Cryptology and Information Security
    dblp_stream: conf/asiacrypt
    aliases: [asiacrypt]
    rank: A
    tags: [crypto]

  - id: CHES
    name: IACR Transactions on Cryptographic Hardware and Embedded Systems
    dblp_stream: journals/tches
    aliases: [ches, tches]
    rank: A
    tags: [crypto]

  - id: FC
    name: Financial Cryptography and Data Security
    dblp_stream: conf/fc
    aliases: [fc]
    rank: A
    tags: [crypto, security]
